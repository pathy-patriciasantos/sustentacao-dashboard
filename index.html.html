<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sustentação — Painel de Prioridades</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.08);
    --border-med: rgba(0,0,0,0.14);
    --text: #1a1a18;
    --text-2: #6b6b66;
    --text-3: #9e9e99;
    --p1: #c93535; --p1-bg: #fdf0f0; --p1-border: #f5c0c0;
    --p2: #b86a00; --p2-bg: #fdf5e6; --p2-border: #f5d898;
    --p3: #1a60b0; --p3-bg: #eef4fd; --p3-border: #b8d0f0;
    --p4: #5a5a55; --p4-bg: #f2f1ec; --p4-border: #d0cfc8;
    --green: #2d7a3a; --green-bg: #eaf5ec; --green-border: #a8d8b0;
    --radius: 10px; --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .header-left h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  .header-left p { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .sync-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text-2); background: var(--surface2); border: 1px solid var(--border-med); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; transition: all .15s; }
  .sync-btn:hover { background: var(--border); }
  .sync-btn.loading svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .last-sync { font-size: 11px; color: var(--text-3); font-family: 'DM Mono', monospace; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #2d7a3a; display: inline-block; margin-right: 4px; }
  .status-dot.error { background: var(--p1); }
  .status-dot.loading-dot { background: var(--p2); animation: pulse .8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* LAYOUT */
  .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }

  /* METRICS */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .metric .lbl { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; margin-bottom: 6px; }
  .metric .val { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1; }
  .metric .sub { font-size: 11px; color: var(--text-3); margin-top: 5px; }
  .metric .sub.danger { color: var(--p1); } .metric .sub.warn { color: var(--p2); } .metric .sub.ok { color: var(--green); }

  /* CHARTS */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .chart-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .chart-box h3 { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; margin-bottom: 14px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-lbl { font-size: 12px; color: var(--text-2); width: 48px; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .bar-cnt { font-size: 12px; color: var(--text-2); min-width: 24px; font-family: 'DM Mono', monospace; }
  .prio-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .prio-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .prio-lbl { font-size: 12px; color: var(--text-2); flex: 1; }
  .prio-cnt { font-size: 13px; font-weight: 500; color: var(--text); min-width: 24px; text-align: right; font-family: 'DM Mono', monospace; }

  /* TOOLBAR */
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .search-wrap { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border-med); border-radius: var(--radius-sm); padding: 0 12px; flex: 1; min-width: 220px; max-width: 320px; transition: border-color .15s; }
  .search-wrap:focus-within { border-color: #1a60b0; }
  .search-wrap svg { color: var(--text-3); flex-shrink: 0; }
  .search-wrap input { flex: 1; border: none; background: transparent; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text); padding: 9px 0; outline: none; }
  .search-wrap input::placeholder { color: var(--text-3); }
  .search-clear { background: none; border: none; cursor: pointer; color: var(--text-3); padding: 2px; display: none; line-height: 1; }
  .search-clear.show { display: block; }
  .pill { font-size: 12px; padding: 6px 13px; border-radius: 20px; border: 1px solid var(--border-med); background: var(--surface); color: var(--text-2); cursor: pointer; transition: all .15s; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
  .pill:hover { background: var(--surface2); }
  .pill.on { background: var(--text); color: #fff; border-color: var(--text); }
  .sep { flex: 1; }
  .sel { font-size: 12px; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-med); background: var(--surface); color: var(--text); font-family: 'DM Sans', sans-serif; cursor: pointer; }

  /* RESULT COUNT */
  .result-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .result-count { font-size: 12px; color: var(--text-2); }
  .result-count strong { color: var(--text); }

  /* CARDS */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); transition: box-shadow .2s, transform .2s; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); transform: translateY(-1px); }
  .card.p1 { border-left: 3px solid var(--p1); }
  .card.p2 { border-left: 3px solid var(--p2); }
  .card.p3 { border-left: 3px solid var(--p3); }
  .card.p4 { border-left: 3px solid #bbb; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .card-key { font-size: 14px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
  .card-key mark { background: #fff3a3; color: #5a4000; border-radius: 3px; padding: 0 2px; }
  .card-link { font-size: 11px; color: var(--text-3); text-decoration: none; display: flex; align-items: center; gap: 3px; margin-top: 3px; }
  .card-link:hover { color: var(--p3); }

  .score-block { text-align: right; }
  .score-num { font-size: 24px; font-weight: 600; color: var(--text); line-height: 1; font-family: 'DM Mono', monospace; }
  .score-unit { font-size: 11px; color: var(--text-3); }
  .score-breakdown { font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .score-extra-tag { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); border-radius: 20px; padding: 1px 6px; font-size: 10px; font-weight: 500; }
  .p-tag { display: inline-block; font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 20px; margin-top: 4px; }
  .p-tag.p1 { background: var(--p1-bg); color: var(--p1); }
  .p-tag.p2 { background: var(--p2-bg); color: var(--p2); }
  .p-tag.p3 { background: var(--p3-bg); color: var(--p3); }
  .p-tag.p4 { background: var(--p4-bg); color: var(--p4); }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .card-field .k { font-size: 10px; color: var(--text-3); margin-bottom: 2px; }
  .card-field .v { font-size: 12px; color: var(--text); font-weight: 500; }

  .extra-box { display: flex; align-items: center; gap: 8px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: var(--radius-sm); padding: 7px 10px; margin-bottom: 8px; }
  .extra-box .e-label { font-size: 11px; color: var(--green); flex: 1; }
  .extra-box .e-val { font-size: 12px; font-weight: 600; color: var(--green); font-family: 'DM Mono', monospace; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tag { font-size: 10px; padding: 3px 8px; border-radius: 20px; background: var(--surface2); color: var(--text-2); border: 1px solid var(--border); }
  .tag.alert { background: var(--p1-bg); color: var(--p1); border-color: var(--p1-border); }
  .tag.warn { background: var(--p2-bg); color: var(--p2); border-color: var(--p2-border); }
  .tag.extra { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }

  .card-obs { font-size: 11px; color: var(--text-2); font-style: italic; margin-bottom: 8px; }

  .progress-wrap { margin-top: 8px; }
  .progress-bar { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .progress-meta { display: flex; justify-content: space-between; margin-top: 4px; }
  .progress-meta span { font-size: 10px; color: var(--text-3); font-family: 'DM Mono', monospace; }
  .progress-meta .extra-pct { color: var(--green); }

  /* EMPTY / LOADING */
  .state-box { padding: 60px 20px; text-align: center; color: var(--text-3); }
  .state-box svg { margin-bottom: 12px; opacity: .4; }
  .state-box p { font-size: 13px; }
  .state-box .sub { font-size: 12px; margin-top: 6px; color: var(--text-3); }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 2px solid var(--border-med); border-top-color: var(--p3); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 12px; }

  /* SKELETON */
  .skeleton { background: linear-gradient(90deg, var(--surface2) 25%, #e8e7e1 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 4px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ERROR BANNER */
  .error-banner { background: var(--p1-bg); border: 1px solid var(--p1-border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: var(--p1); display: none; }
  .error-banner.show { display: block; }

  @media (max-width: 700px) {
    .container { padding: 16px; }
    .header { padding: 14px 16px; }
    .metrics { grid-template-columns: 1fr 1fr; }
    .charts-row { grid-template-columns: 1fr; }
    .toolbar { gap: 6px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Sustentação — Painel de Prioridades</h1>
    <p>Dados atualizados direto da planilha · aba Controle de Bugs</p>
  </div>
  <div class="header-right">
    <span class="last-sync" id="lastSync">—</span>
    <button class="sync-btn" id="syncBtn" onclick="loadData()">
      <svg id="syncIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.49"/></svg>
      Atualizar
    </button>
  </div>
</div>

<div class="container">
  <div class="error-banner" id="errorBanner"></div>
  <div class="metrics" id="metricsRow">
    <div class="metric"><div class="skeleton" style="height:11px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:40%"></div></div>
    <div class="metric"><div class="skeleton" style="height:11px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:40%"></div></div>
    <div class="metric"><div class="skeleton" style="height:11px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:40%"></div></div>
    <div class="metric"><div class="skeleton" style="height:11px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:40%"></div></div>
  </div>
  <div class="charts-row" id="chartsRow"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar por card — ex: SEF-1406, 1269…">
      <button class="search-clear" id="searchClear">✕</button>
    </div>
    <button class="pill on" data-f="all">Todos</button>
    <button class="pill" data-f="P1">P1</button>
    <button class="pill" data-f="P2">P2</button>
    <button class="pill" data-f="P3">P3</button>
    <button class="pill" data-f="P4">P4</button>
    <button class="pill" data-f="extra">Com bônus</button>
    <div class="sep"></div>
    <select class="sel" id="projSel">
      <option value="all">Todos os projetos</option>
    </select>
    <select class="sel" id="sortSel">
      <option value="score">Score ↓</option>
      <option value="clientes">Clientes ↓</option>
      <option value="prio">Prioridade</option>
    </select>
  </div>

  <div class="result-bar">
    <div class="result-count" id="resultCount"></div>
  </div>
  <div class="cards-grid" id="cardsGrid">
    <div class="state-box" style="grid-column:1/-1"><div class="spinner"></div><p>Carregando dados da planilha…</p></div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────
const SHEET_ID   = '1Ihf4fCZWKm9xbr3y1NqIk-OCsVwQ5KWBNczwcaLLdEA';
const SHEET_NAME = 'Controle de Bugs'; // nome da aba
// URL de exportação CSV pública do Google Sheets
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

// ─── STATE ────────────────────────────────────────────────
let allBugs = [];
let fPrio = 'all', fProj = 'all', sort = 'score', search = '';

// ─── LOAD DATA ────────────────────────────────────────────
async function loadData() {
  const btn = document.getElementById('syncBtn');
  const icon = document.getElementById('syncIcon');
  const dot = document.querySelector('.status-dot');
  btn.classList.add('loading');
  if(dot){ dot.className='status-dot loading-dot'; }

  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('Erro ao buscar planilha: ' + res.status);
    const text = await res.text();
    allBugs = parseCSV(text);
    populateProjFilter();
    renderAll();

    const now = new Date();
    document.getElementById('lastSync').textContent =
      `Atualizado ${now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})}`;
    if(dot){ dot.className='status-dot'; }
    document.getElementById('errorBanner').classList.remove('show');
  } catch(e) {
    showError('Não foi possível carregar a planilha. Verifique se ela está pública. ' + e.message);
    if(dot){ dot.className='status-dot error'; }
  }
  btn.classList.remove('loading');
}

// ─── PARSE CSV ────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  // Parse simples respeitando aspas
  function parseLine(line) {
    const cells = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cells.push(cur.trim());
    return cells;
  }

  const header = parseLine(lines[0]).map(h => h.replace(/^"|"$/g,'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''));

  // Índices das colunas que precisamos
  // Colunas da aba: jira_key, projeto, qtd_clientes_afetados, status_jira,
  // prioridade, is_ouvidoria, is_reclame_aqui, is_procon, is_onboarding,
  // data_abertura, faixa_criticidade, peso_metabase
  const idx = {
    key:        header.indexOf('jira_key'),
    proj:       header.indexOf('projeto'),
    clientes:   header.indexOf('qtd_clientes_afetados'),
    status:     header.indexOf('status_jira'),
    prio:       header.indexOf('prioridade'),
    ouvidoria:  header.indexOf('is_ouvidoria'),
    reclame:    header.indexOf('is_reclame_aqui'),
    procon:     header.indexOf('is_procon'),
    onboarding: header.indexOf('is_onboarding'),
    abertura:   header.indexOf('data_abertura'),
    faixa:      header.indexOf('faixa_criticidade'),
  };

  // Fallback: tenta encontrar pelo conteúdo se índices não foram encontrados
  const bugs = [];
  const seen = new Set();

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cells = parseLine(lines[i]).map(c => c.replace(/^"|"$/g,''));
    const key = idx.key >= 0 ? cells[idx.key] : '';
    if (!key || !key.match(/^[A-Z]+-\d+$/) || seen.has(key)) continue;
    seen.add(key);

    const clientes = parseInt(cells[idx.clientes] || '0') || 0;
    const ouvidoria = cells[idx.ouvidoria] === '1' || cells[idx.ouvidoria]?.toLowerCase() === 'sim' ? 1 : 0;
    const reclame   = cells[idx.reclame] === '1' || cells[idx.reclame]?.toLowerCase() === 'sim' ? 1 : 0;
    const procon    = cells[idx.procon] === '1' || cells[idx.procon]?.toLowerCase() === 'sim' ? 1 : 0;
    const onboarding= cells[idx.onboarding] === '1' || cells[idx.onboarding]?.toLowerCase() === 'sim' ? 1 : 0;

    // Calcular score com os pesos da planilha
    const scoreBase = calcScore(clientes, ouvidoria, reclame, procon, onboarding);
    const prio = mapPrio(scoreBase);

    bugs.push({
      key,
      proj:      cells[idx.proj] || '',
      clientes,
      status:    cells[idx.status] || '',
      prio,
      scoreBase,
      pesoExtra: 0,
      motivoExtra: '',
      ouvidoria, reclame, procon, onboarding,
      abertura:  cells[idx.abertura] || '',
      faixa:     cells[idx.faixa] || '',
    });
  }

  // Ordenar por score descendente
  bugs.sort((a,b) => b.scoreBase - a.scoreBase);
  return bugs;
}

function calcScore(clientes, ouvidoria, reclame, procon, onboarding) {
  // Pesos da planilha (aba config)
  let pts = 0;
  if      (clientes === 1)          pts += 5;
  else if (clientes <= 5)           pts += 10;
  else if (clientes <= 20)          pts += 20;
  else if (clientes <= 50)          pts += 30;
  else if (clientes <= 100)         pts += 40;
  else if (clientes <= 200)         pts += 32;
  else                              pts += 40;

  if (ouvidoria)  pts += 10;
  if (reclame)    pts += 15;
  if (procon)     pts += 7;
  if (onboarding) pts += 10;

  // Multiplicador de volume
  let mult = 1;
  if      (clientes > 200) mult = 1.4;
  else if (clientes > 100) mult = 1.3;
  else if (clientes > 50)  mult = 1.2;
  else if (clientes > 20)  mult = 1.1;

  return Math.round(pts * mult * 10) / 10;
}

function mapPrio(score) {
  if (score >= 80) return 'P1 — Crítico';
  if (score >= 55) return 'P2 — Alto';
  if (score >= 30) return 'P3 — Médio';
  if (score >= 10) return 'P4 — Baixo';
  return 'P5 — Mínimo';
}

// ─── HELPERS ──────────────────────────────────────────────
const prioOrder = {'P1 — Crítico':1,'P2 — Alto':2,'P3 — Médio':3,'P4 — Baixo':4,'P5 — Mínimo':5};
const prioK = b => b.prio.includes('P1')?'P1':b.prio.includes('P2')?'P2':b.prio.includes('P3')?'P3':'P4';
const prioColors = {P1:'#c93535',P2:'#b86a00',P3:'#1a60b0',P4:'#aaa'};
const projColors = {SEF:'#1a60b0',SFDP:'#2d7a3a',SUS:'#b86a00',BBC:'#7a3ab8',SGDE:'#5a5a55'};

function highlight(text, term) {
  if (!term) return text;
  const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function getFiltered() {
  const q = search.trim().toUpperCase();
  let d = allBugs.filter(b => {
    if (fProj !== 'all' && b.proj !== fProj) return false;
    if (fPrio === 'extra') return b.pesoExtra > 0;
    if (fPrio !== 'all' && prioK(b) !== fPrio) return false;
    if (q && !b.key.toUpperCase().includes(q)) return false;
    return true;
  });
  if (sort === 'score')    d.sort((a,b) => (b.scoreBase+b.pesoExtra)-(a.scoreBase+a.pesoExtra));
  else if (sort === 'clientes') d.sort((a,b) => b.clientes-a.clientes);
  else d.sort((a,b) => (prioOrder[a.prio]||9)-(prioOrder[b.prio]||9));
  return d;
}

// ─── RENDER ───────────────────────────────────────────────
function renderAll() {
  renderMetrics();
  renderCharts();
  renderCards();
}

function renderMetrics() {
  const d = allBugs;
  const p1 = d.filter(b=>prioK(b)==='P1').length;
  const p2 = d.filter(b=>prioK(b)==='P2').length;
  const p3 = d.filter(b=>prioK(b)==='P3').length;
  const totalC = d.reduce((s,b)=>s+b.clientes,0);
  document.getElementById('metricsRow').innerHTML = `
    <div class="metric"><div class="lbl">Total de bugs</div><div class="val">${d.length}</div><div class="sub">ativos no controle</div></div>
    <div class="metric"><div class="lbl">P1 crítico</div><div class="val">${p1}</div><div class="sub ${p1>0?'danger':'ok'}">${p1>0?'ação imediata necessária':'nenhum crítico'}</div></div>
    <div class="metric"><div class="lbl">P2 + P3</div><div class="val">${p2+p3}</div><div class="sub warn">${p2} altos · ${p3} médios</div></div>
    <div class="metric"><div class="lbl">Clientes impactados</div><div class="val">${totalC.toLocaleString('pt-BR')}</div><div class="sub">total acumulado</div></div>
  `;
}

function renderCharts() {
  const projC = {};
  allBugs.forEach(b=>{ projC[b.proj]=(projC[b.proj]||0)+1; });
  const ps = Object.entries(projC).sort((a,b)=>b[1]-a[1]);
  const maxP = ps[0]?.[1] || 1;
  const prioC = {P1:0,P2:0,P3:0,P4:0};
  allBugs.forEach(b=>{ const k=prioK(b); if(prioC[k]!==undefined) prioC[k]++; });

  document.getElementById('chartsRow').innerHTML = `
    <div class="chart-box">
      <h3>Bugs por projeto</h3>
      ${ps.map(([p,c])=>`<div class="bar-row"><div class="bar-lbl">${p}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/maxP*100)}%;background:${projColors[p]||'#888'}"></div></div><div class="bar-cnt">${c}</div></div>`).join('')}
    </div>
    <div class="chart-box">
      <h3>Distribuição por prioridade</h3>
      ${Object.entries(prioC).map(([k,c])=>`<div class="prio-row"><div class="prio-dot" style="background:${prioColors[k]}"></div><div class="prio-lbl">${k==='P1'?'P1 — Crítico':k==='P2'?'P2 — Alto':k==='P3'?'P3 — Médio':'P4 — Baixo'}</div><div class="prio-cnt">${c}</div><div style="flex:1;margin-left:8px"><div class="bar-track"><div class="bar-fill" style="width:${allBugs.length?Math.round(c/allBugs.length*100):0}%;background:${prioColors[k]}"></div></div></div></div>`).join('')}
    </div>
  `;
}

function populateProjFilter() {
  const projs = [...new Set(allBugs.map(b=>b.proj))].sort();
  const sel = document.getElementById('projSel');
  sel.innerHTML = '<option value="all">Todos os projetos</option>' +
    projs.map(p=>`<option value="${p}">${p}</option>`).join('');
}

function renderCards() {
  const data = getFiltered();
  const q = search.trim();
  const countEl = document.getElementById('resultCount');
  countEl.innerHTML = q
    ? `<strong>${data.length}</strong> resultado${data.length!==1?'s':''} para "<strong>${q}</strong>"`
    : `Exibindo <strong>${data.length}</strong> de ${allBugs.length} bugs`;

  if (!data.length) {
    document.getElementById('cardsGrid').innerHTML = `<div class="state-box" style="grid-column:1/-1"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>Nenhum card encontrado${q?' para "'+q+'"':''}.</p></div>`;
    return;
  }

  const maxScore = Math.max(...allBugs.map(b=>b.scoreBase+b.pesoExtra), 1);
  document.getElementById('cardsGrid').innerHTML = data.map(b => {
    const pk = prioK(b);
    const total = b.scoreBase + b.pesoExtra;
    const pctTotal = Math.round(total/maxScore*100);
    const pctBase  = Math.round(b.scoreBase/maxScore*100);

    const tags = [];
    if (b.ouvidoria) tags.push({t:'Ouvidoria',cls:'alert'});
    if (b.reclame)   tags.push({t:'Reclame Aqui',cls:'alert'});
    if (b.procon)    tags.push({t:'Procon',cls:'alert'});
    if (b.onboarding)tags.push({t:'Onboarding',cls:'warn'});
    if (b.pesoExtra>0) tags.push({t:`+${b.pesoExtra} bônus`,cls:'extra'});

    const extraBox = b.pesoExtra>0 ? `
      <div class="extra-box">
        <span class="e-label">⭐ ${b.motivoExtra||'Peso extra manual'}</span>
        <span class="e-val">+${b.pesoExtra} pts</span>
      </div>` : '';

    const scoreBreak = b.pesoExtra>0
      ? `<div class="score-breakdown">${Math.round(b.scoreBase)} base &nbsp;<span class="score-extra-tag">+${b.pesoExtra}</span></div>`
      : '';

    return `
    <div class="card ${pk.toLowerCase()}">
      <div class="card-top">
        <div>
          <div class="card-key">${highlight(b.key, q)}</div>
          <a class="card-link" href="https://contmatic.atlassian.net/browse/${b.key}" target="_blank">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Abrir no Jira
          </a>
        </div>
        <div class="score-block">
          <div><span class="score-num">${Math.round(total)}</span> <span class="score-unit">pts</span></div>
          ${scoreBreak}
          <span class="p-tag ${pk.toLowerCase()}">${pk}</span>
        </div>
      </div>
      <div class="card-grid">
        <div class="card-field"><div class="k">Projeto</div><div class="v">${b.proj}</div></div>
        <div class="card-field"><div class="k">Clientes afetados</div><div class="v">${b.clientes}</div></div>
        <div class="card-field"><div class="k">Status</div><div class="v" style="font-size:11px;font-weight:400">${b.status}</div></div>
        <div class="card-field"><div class="k">Abertura</div><div class="v" style="font-size:11px;font-weight:400">${b.abertura}</div></div>
      </div>
      ${extraBox}
      ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="tag ${t.cls}">${t.t}</span>`).join('')}</div>` : ''}
      ${b.faixa ? `<div style="font-size:10px;color:var(--text-3);margin-bottom:8px">${b.faixa}</div>` : ''}
      <div class="progress-wrap">
        <div class="progress-bar" style="position:relative">
          ${b.pesoExtra>0?`<div class="progress-fill" style="width:${pctTotal}%;background:#a8d8b0;position:absolute;top:0;left:0;height:100%;border-radius:4px"></div>`:''}
          <div class="progress-fill" style="width:${pctBase}%;background:${prioColors[pk]}"></div>
        </div>
        <div class="progress-meta">
          <span>Peso relativo: ${pctTotal}%</span>
          ${b.pesoExtra>0?`<span class="extra-pct">+${b.pesoExtra} pts bônus</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('show');
  document.getElementById('cardsGrid').innerHTML = `<div class="state-box" style="grid-column:1/-1"><p>${msg}</p><p class="sub">Verifique se a planilha está compartilhada publicamente e tente atualizar.</p></div>`;
}

// ─── EVENTS ───────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  search = e.target.value;
  document.getElementById('searchClear').classList.toggle('show', search.length>0);
  renderCards();
});
document.getElementById('searchClear').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  search = '';
  document.getElementById('searchClear').classList.remove('show');
  renderCards();
});
document.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); fPrio = b.dataset.f; renderCards();
}));
document.getElementById('projSel').addEventListener('change', e => { fProj = e.target.value; renderCards(); });
document.getElementById('sortSel').addEventListener('change', e => { sort = e.target.value; renderCards(); });

// ─── INIT ─────────────────────────────────────────────────
loadData();
// Auto-refresh a cada 5 minutos
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
